name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  SUMMONER_VST3_SDK_CACHE: ${{ github.workspace }}/target.noindex/sdk-cache/vst3sdk
  SUMMONER_AU_SDK_CACHE: ${{ github.workspace }}/target.noindex/sdk-cache/audiounitsdk
  SUMMONER_DEV_PLUGIN_ROOTS: ${{ github.workspace }}
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - uses: actions/cache@v4
        with:
          path: target.noindex/sdk-cache
          key: sdk-${{ runner.os }}-${{ hashFiles('testkit/plugins/vst3-sdk.pins', 'tools/au-sdk.sh', 'tools/fetch-vst3-subs.sh', 'tools/fetch-au-sdk.sh') }}
      - run: command -v ninja || brew install ninja
      - run: tools/build-plugins.sh --fetch
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features summoner-host/test-hooks,summoner-proc/test-hooks -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - run: cd "$RUNNER_TEMP" && cargo install --locked cargo-deny@0.22.2
      - run: cargo deny check
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check
      - run: SUMMONER_REQUIRE_LAB_PLUGINS=1 cargo test --workspace --locked --no-fail-fast --features summoner-host/test-hooks,summoner-proc/test-hooks -- --test-threads 2
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo check -p summoner-proto -p summoner-plugin -p summoner-rt -p summoner -p summoner-scan -p summoner-testkit -p summoner-sys-ui -p summoner-proc --all-targets --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p summoner-proto -p summoner-plugin -p summoner-rt -p summoner -p summoner-scan -p summoner-testkit -p summoner-sys-ui -p summoner-proc --no-deps --locked
      - run: cargo test -p summoner-proto -p summoner-plugin -p summoner-rt -p summoner -p summoner-scan -p summoner-testkit -p summoner-sys-ui -p summoner-proc --locked --no-fail-fast -- --test-threads 2
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo check -p summoner-proto -p summoner-rt -p summoner-plugin -p summoner --all-targets --locked
      - run: cargo test -p summoner-rt -p summoner --locked --no-fail-fast -- --test-threads 2
      - run: cargo test -p summoner-proto --lib --locked --no-fail-fast -- --test-threads 2
